
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ${PROJECT_NAME:-monotime}-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=15m
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    restart: always

volumes:
  ollama_data:

